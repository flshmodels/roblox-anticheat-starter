name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lune on the runner
        run: |
          curl -fsSL -o lune.zip https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip
          unzip -q lune.zip
          chmod +x lune
      - name: Run unit tests
        run: ./lune run tests/run
